<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Low-rise school building with shaded courtyards and trees</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a26"/>
      <stop offset="1" stop-color="#33566f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#8fc7ef" stroke-opacity=".07"/>
    </pattern>
    <pattern id="win" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect x="7" y="8" width="20" height="18" fill="#ffd166" fill-opacity=".32"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="676" cy="110" r="30" fill="#ffd166" opacity=".8"/>
  <circle cx="676" cy="110" r="100" fill="#f08a3c" opacity=".1"/>
  <!-- main block -->
  <rect x="118" y="248" width="430" height="222" fill="#24405a"/>
  <rect x="118" y="248" width="430" height="222" fill="url(#win)"/>
  <path d="M118 248h430v14H118Z" fill="#3d6182"/>
  <path d="M118 248v222M548 248v222" stroke="#f08a3c" stroke-width="4" opacity=".8"/>
  <!-- floor bands -->
  <g stroke="#0f1f2c" stroke-width="6">
    <path d="M118 322h430M118 396h430"/>
  </g>
  <!-- side wing -->
  <rect x="548" y="300" width="150" height="170" fill="#1e3346"/>
  <rect x="548" y="300" width="150" height="170" fill="url(#win)"/>
  <path d="M548 300h150v12H548Z" fill="#35516a"/>
  <!-- entrance canopy -->
  <rect x="286" y="404" width="120" height="12" rx="3" fill="#f08a3c"/>
  <rect x="300" y="416" width="18" height="54" fill="#152534"/>
  <rect x="374" y="416" width="18" height="54" fill="#152534"/>
  <rect x="330" y="430" width="32" height="40" fill="#0f1f2c"/>
  <!-- courtyard wall -->
  <path d="M118 470h584" stroke="#35516a" stroke-width="10"/>
  <!-- trees -->
  <g>
    <rect x="64" y="418" width="10" height="52" fill="#2b3f2f"/>
    <circle cx="69" cy="400" r="42" fill="#1f4a3a"/>
    <circle cx="42" cy="414" r="28" fill="#265a44"/>
    <circle cx="98" cy="416" r="26" fill="#265a44"/>
  </g>
  <g>
    <rect x="748" y="424" width="9" height="46" fill="#2b3f2f"/>
    <circle cx="752" cy="408" r="34" fill="#1f4a3a"/>
    <circle cx="730" cy="420" r="22" fill="#265a44"/>
    <circle cx="774" cy="422" r="20" fill="#265a44"/>
  </g>
  <!-- ground -->
  <rect y="470" width="800" height="130" fill="#0d1925"/>
  <path d="M0 470h800" stroke="#8fc7ef" stroke-opacity=".18" stroke-width="2"/>
  <g stroke="#8fc7ef" stroke-opacity=".1">
    <path d="M0 502h800M0 540h800M0 578h800"/>
  </g>
</svg>
